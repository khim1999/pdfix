name: pdf_toolkit
description: Compress and split PDF files.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.2
  syncfusion_flutter_pdf: ^27.1.48
  pdfx: 2.6.0
  pdf: ^3.11.1
  path: ^1.9.0
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
